<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Agent - Zero-Charge UI</title>
    <style>
        body { font-family: sans-serif; margin: 2em; }
        .container { max-width: 800px; margin: auto; }
        .component { border: 1px solid #ccc; padding: 1em; margin-bottom: 1em; }
        h2 { color: #333; }
        textarea { width: 100%; height: 150px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Digital Agent - Zero-Charge Execution UI</h1>

        <div id="p0-component"></div>
        <div id="p4-component"></div>

    </div>

    <script>
        // Load and inject the components
        fetch('P0_Component.html')
            .then(response => response.text())
            .then(data => document.getElementById('p0-component').innerHTML = data);

        fetch('P4_Component.html')
            .then(response => response.text())
            .then(data => document.getElementById('p4-component').innerHTML = data);
    </script>
</body>
</html>

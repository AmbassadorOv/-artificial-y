<div class="component">
    <h2>P4 - Aggregation (AER)</h2>
    <p>This component displays the final, tab-separated report generated by the Digital Agent. The operator is responsible for copying this output and using it as the input for the next cycle (the "Human-in-the-Loop I/O Bus").</p>

    <label for="p4-output"><strong>Final P4 Report (Tab-Separated):</strong></label>
    <textarea id="p4-output" readonly placeholder="The final report from the Digital Agent will appear here..."></textarea>

    <button onclick="copyToClipboard()">Copy to Clipboard</button>
</div>

<script>
    function copyToClipboard() {
        const output = document.getElementById('p4-output');
        output.select();
        document.execCommand('copy');
        alert('Report copied to clipboard!');
    }

    // This is a stub to simulate receiving data from the Digital Agent.
    // In a real application, this would be populated by a fetch call to the backend.
    function displayP4Report(reportData) {
        document.getElementById('p4-output').value = reportData;
    }
</script>
